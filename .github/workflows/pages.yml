# =============================================================
# GitHub Actions workflow — Force GitHub Pages rebuild on push
# Auto-deploy quand Dashboard_data.js change
# =============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Dashboard_data.js'
      - 'index.html'
  workflow_dispatch:  # déclenchement manuel possible

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
